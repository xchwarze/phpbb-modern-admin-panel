name: Checks

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite, intl, gd, exif
          coverage: none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phpbb/phpbb
          ref: 3.3.x
          path: phpbb-src
          persist-credentials: false
      - name: Install extension into phpBB test board
        run: |
          mkdir -p phpbb-src/phpBB/ext/dsr
          cp -a dsr/modernadminpanel phpbb-src/phpBB/ext/dsr/
      - name: Prepare phpBB functional test environment
        working-directory: phpbb-src
        run: .github/setup-phpbb.sh sqlite3 8.3 0
      - name: Run extension functional tests
        working-directory: phpbb-src
        run: phpBB/vendor/bin/phpunit -c phpBB/ext/dsr/modernadminpanel/phpunit.xml.dist

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: PHP syntax
        run: find dsr/modernadminpanel tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Bundled JavaScript syntax
        run: node --check dsr/modernadminpanel/adm/style/js/studio.js
      - name: Helper and translation checks
        run: php tests/helpers.php
      - name: Metadata, assets, and documentation checks
        run: node --test tests/repository.test.mjs
      - run: composer validate --strict --no-check-version --no-check-publish --no-check-lock dsr/modernadminpanel/composer.json

  epv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phpbb/epv
          ref: 8ecb57b61a23a7925b0adbf7b53016e4efee4a24
          path: epv
          persist-credentials: false
      - name: Install EPV dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: epv
      - name: Validate extension with EPV
        run: php src/EPV.php run --dir="$GITHUB_WORKSPACE/dsr/modernadminpanel"
        working-directory: epv
